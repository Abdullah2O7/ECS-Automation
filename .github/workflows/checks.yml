# The checks every share must pass (the same ones "Share my work" runs before sending): every sheet has its tests, the
# code compiles, follows the lint rules, its unit tests pass and Playwright finds every test. Nothing here signs in anywhere or runs a browser:
# the tests themselves run on each person's computer, with their own account.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every sheet has its tests
        run: npm run story:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Every test is found
        run: npx playwright test --list --reporter=line --pass-with-no-tests
